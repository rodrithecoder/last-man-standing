name: Android widget debug APK

on:
  workflow_dispatch:
  push:
    branches: [feature/android-weekly-widget]
    paths:
      - "android-widget/**"
      - ".github/workflows/android-widget.yml"

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - name: Test Monday–Sunday dashboard calculations
        run: node --test src/weeklyWidget.test.js
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Verify preinstalled Android SDK
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME"
          ls "$ANDROID_HOME/platforms"
          test -d "$ANDROID_HOME/platforms/android-35"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"
      - name: Build widget APK
        working-directory: android-widget
        run: gradle --no-daemon :app:assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: easy-party-kit-widget-debug-apk
          path: android-widget/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 14
