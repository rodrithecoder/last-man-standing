plugins { id 'com.android.application' }
android {
    namespace 'ca.easypartykit.widget'
    compileSdk 35
    defaultConfig {
        applicationId 'ca.easypartykit.widget'
        minSdk 26
        targetSdk 35
        versionCode 3
        versionName '0.1.2'
        // This URL must point to a deployment containing the snapshot bridge.
        buildConfigField 'String', 'APP_URL', '"https://last-man-standing-git-fea-23b819-rodrigoguzmanbg-6872s-projects.vercel.app/"'
    }
    buildTypes { release { minifyEnabled false } }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    buildFeatures { buildConfig true }
}
